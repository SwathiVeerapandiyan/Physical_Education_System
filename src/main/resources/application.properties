spring.application.name=pe

# PostgreSQL Datasource Configuration (connects to local PostgreSQL instance)
# spring.datasource.url=jdbc:postgresql://localhost:5432/sports_management
# spring.datasource.username=postgres
# spring.datasource.password=123
# spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Alternative H2 Datasource Configuration (In-memory) ---
spring.datasource.url=jdbc:h2:mem:sports_management;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson configuration: Ignore unknown fields from frontend requests
spring.jackson.deserialization.fail-on-unknown-properties=false


